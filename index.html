<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bé Học Xem Đồng Hồ & Phát Âm</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #f0f8ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 480px;
      width: 100%;
    }
    h1 {
      color: #2c3e50;
      margin-top: 0;
      font-size: 24px;
    }
    canvas {
      background-color: #fff;
      border-radius: 50%;
      margin: 15px 0;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      outline: none;
    }
    .btn-mic {
      background-color: #ff6b6b;
      box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
    }
    .btn-mic.listening {
      background-color: #4ecdc4;
      animation: pulse 1.5s infinite;
    }
    .btn-speak {
      background-color: #9b59b6;
      box-shadow: 0 4px 12px rgba(155, 89, 182, 0.3);
    }
    .btn-toggle {
      background-color: #3498db;
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
    }
    .btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(1px);
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
    .status-text {
      margin-top: 15px;
      font-size: 15px;
      color: #7f8c8d;
      min-height: 22px;
    }
    .result-text {
      margin-top: 8px;
      font-size: 18px;
      font-weight: bold;
      color: #2ecc71;
      min-height: 26px;
    }
    .mode-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: bold;
      background: #e8f4f8;
      color: #2980b9;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⏰ Bé Học Xem Đồng Hồ</h1>
    <div id="modeBadge" class="mode-badge">Đang chạy giờ thực tế</div>
    
    <canvas id="clock" width="280" height="280"></canvas>

    <div class="btn-group">
      <button id="listenBtn" class="btn btn-mic">
        🎤 Bấm vào và nói giờ nhé
      </button>

      <button id="speakBtn" class="btn btn-speak">
        🔊 Đọc giờ trên đồng hồ
      </button>

      <button id="toggleRealtimeBtn" class="btn btn-toggle">
        ⏸️ Tạm dừng chạy thực tế
      </button>
    </div>

    <div id="status" class="status-text">Đồng hồ đang chạy theo giờ thực...</div>
    <div id="result" class="result-text"></div>
  </div>

  <script>
    // --- 1. KHỞI TẠO CANVAS & ĐỒNG HỒ ---
    const canvas = document.getElementById("clock");
    const ctx = canvas.getContext("2d");
    const radius = canvas.height / 2;
    ctx.translate(radius, radius);

    let currentHour = 0;
    let currentMinute = 0;
    let currentSecond = 0;
    let isRealtime = true;
    let lastSpokenMinute = -1;

    function drawClock(hour, minute, second = 0) {
      ctx.clearRect(-radius, -radius, canvas.width, canvas.height);
      
      // Mặt đồng hồ
      ctx.beginPath();
      ctx.arc(0, 0, radius - 10, 0, 2 * Math.PI);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#3498db';
      ctx.lineWidth = 8;
      ctx.stroke();

      // Tâm đồng hồ
      ctx.beginPath();
      ctx.arc(0, 0, 8, 0, 2 * Math.PI);
      ctx.fillStyle = '#2c3e50';
      ctx.fill();

      // Số chỉ giờ
      ctx.font = 'bold 16px Segoe UI';
      ctx.textBaseline = "middle";
      ctx.textAlign = "center";
      ctx.fillStyle = '#2c3e50';
      for (let num = 1; num <= 12; num++) {
        let ang = num * Math.PI / 6;
        ctx.rotate(ang);
        ctx.translate(0, -radius + 32);
        ctx.rotate(-ang);
        ctx.fillText(num.toString(), 0, 0);
        ctx.rotate(ang);
        ctx.translate(0, radius - 32);
        ctx.rotate(-ang);
      }

      // Kim Giờ
      let hourAngle = ((hour % 12) + minute / 60 + second / 3600) * (Math.PI / 6);
      drawHand(hourAngle, radius * 0.48, 6, '#2c3e50');

      // Kim Phút
      let minuteAngle = (minute + second / 60) * (Math.PI / 30);
      drawHand(minuteAngle, radius * 0.68, 4, '#e74c3c');

      // Kim Giây (Chỉ vẽ khi ở chế độ Real-time)
      if (isRealtime) {
        let secondAngle = second * (Math.PI / 30);
        drawHand(secondAngle, radius * 0.78, 2, '#f39c12');
      }
    }

    function drawHand(pos, length, width, color) {
      ctx.beginPath();
      ctx.lineWidth = width;
      ctx.lineCap = "round";
      ctx.strokeStyle = color;
      ctx.moveTo(0, 0);
      ctx.rotate(pos);
      ctx.lineTo(0, -length);
      ctx.stroke();
      ctx.rotate(-pos);
    }

    // --- 2. PHÁT ÂM GIỌNG NÓI (SPEECH SYNTHESIS) ---
    function speakTime(hour, minute) {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // Dừng phát âm cũ nếu đang phát

      let h = hour % 12;
      if (h === 0) h = 12;

      let text = `Bây giờ là ${h} giờ`;
      if (minute === 0) {
        text += " đúng";
      } else if (minute === 30) {
        text += " rưỡi";
      } else {
        text += ` ${minute} phút`;
      }

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'vi-VN';
      utterance.rate = 0.85; // Đọc chậm một chút cho bé dễ nghe

      // Chọn voice tiếng Việt nếu trình duyệt hỗ trợ
      const voices = window.speechSynthesis.getVoices();
      const viVoice = voices.find(v => v.lang.includes('vi') || v.lang.includes('VI'));
      if (viVoice) utterance.voice = viVoice;

      window.speechSynthesis.speak(utterance);
    }

    // --- 3. VÒNG LẶP REAL-TIME ---
    function updateRealtimeClock() {
      if (!isRealtime) return;

      const now = new Date();
      currentHour = now.getHours();
      currentMinute = now.getMinutes();
      currentSecond = now.getSeconds();

      drawClock(currentHour, currentMinute, currentSecond);

      // Đọc giờ tự động mỗi khi sang phút mới
      if (currentMinute !== lastSpokenMinute && currentSecond === 0) {
        lastSpokenMinute = currentMinute;
        speakTime(currentHour, currentMinute);
        document.getElementById('result').innerText = `✨ Bây giờ là: ${currentHour % 12 || 12} giờ ${currentMinute} phút`;
      }
    }

    setInterval(updateRealtimeClock, 1000);

    // --- 4. XỬ LÝ NÚT BẤM & ĐỔI CHẾ ĐỘ ---
    const toggleBtn = document.getElementById('toggleRealtimeBtn');
    const modeBadge = document.getElementById('modeBadge');
    const statusText = document.getElementById('status');
    const resultText = document.getElementById('result');

    toggleBtn.addEventListener('click', () => {
      isRealtime = !isRealtime;
      if (isRealtime) {
        toggleBtn.innerText = "⏸️ Tạm dừng chạy thực tế";
        modeBadge.innerText = "Đang chạy giờ thực tế";
        modeBadge.style.background = "#e8f4f8";
        modeBadge.style.color = "#2980b9";
        statusText.innerText = "Đồng hồ đang chạy theo giờ thực...";
        lastSpokenMinute = -1; // Reset để có thể đọc ngay khi đúng phút
      } else {
        toggleBtn.innerText = "▶️ Bật chạy giờ thực tế";
        modeBadge.innerText = "Chế độ luyện tập / Đặt giờ";
        modeBadge.style.background = "#fef9e7";
        modeBadge.style.color = "#f39c12";
        statusText.innerText = "Bé hãy nói giờ để xoay kim đồng hồ!";
      }
    });

    document.getElementById('speakBtn').addEventListener('click', () => {
      speakTime(currentHour, currentMinute);
      let displayH = currentHour % 12 || 12;
      resultText.innerText = `🔊 Đã đọc: ${displayH} giờ ${currentMinute} phút`;
    });

    // --- 5. XỬ LÝ NHẬN DẠNG GIỌNG NÓI ---
    const textToNumMap = {
      "không": 0, "mốt": 1, "một": 1, "hai": 2, "ba": 3, "bốn": 4, "tư": 4, 
      "năm": 5, "lăm": 5, "sáu": 6, "bảy": 7, "tám": 8, "chín": 9, "mười": 10,
      "chục": 10, "rưỡi": 30
    };

    function wordsToNumber(str) {
      if (!str) return null;
      str = str.trim();
      if (!isNaN(str)) return parseInt(str, 10);

      let words = str.split(/\s+/);
      let total = 0;
      let temp = 0;

      for (let w of words) {
        let val = textToNumMap[w];
        if (val !== undefined) {
          if (val === 10) {
            temp = temp === 0 ? 10 : temp * 10;
          } else {
            temp += val;
          }
        }
      }
      total += temp;
      return total;
    }

    function parseTimeSpeech(text) {
      text = text.toLowerCase();
      let hour = null;
      let minute = 0;

      if (text.includes("rưỡi")) minute = 30;

      const hourMatch = text.match(/(.*?)\s*giờ/);
      if (hourMatch) {
        let hourStr = hourMatch[1].trim();
        let hourWords = hourStr.split(" ").slice(-2).join(" ");
        hour = wordsToNumber(hourWords);
      }

      if (!text.includes("rưỡi")) {
        const minuteMatch = text.match(/giờ\s*(.*?)(?:\s*phút|$)/);
        if (minuteMatch && minuteMatch[1]) {
          let minStr = minuteMatch[1].trim();
          if (minStr) minute = wordsToNumber(minStr);
        }
      }

      if (hour !== null && !isNaN(hour) && minute !== null && !isNaN(minute)) {
        return { hour, minute };
      }
      return null;
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'vi-VN';
      recognition.interimResults = false;

      const listenBtn = document.getElementById('listenBtn');

      listenBtn.addEventListener('click', () => {
        try { recognition.start(); } catch (e) { recognition.stop(); }
      });

      recognition.onstart = () => {
        listenBtn.classList.add('listening');
        listenBtn.innerHTML = "🎙️ Đang nghe bé nói...";
        statusText.innerText = "Bé nói rõ câu giờ nhé (Ví dụ: Mười giờ mười lăm phút)";
      };

      recognition.onend = () => {
        listenBtn.classList.remove('listening');
        listenBtn.innerHTML = "🎤 Bấm vào và nói giờ nhé";
      };

      recognition.onresult = (event) => {
        const speechResult = event.results[0][0].transcript;
        statusText.innerText = `Bé vừa nói: "${speechResult}"`;

        const parsedTime = parseTimeSpeech(speechResult);

        if (parsedTime) {
          // Tự động chuyển sang chế độ thủ công khi bé nói giờ
          if (isRealtime) {
            isRealtime = false;
            toggleBtn.innerText = "▶️ Bật chạy giờ thực tế";
            modeBadge.innerText = "Chế độ luyện tập / Đặt giờ";
            modeBadge.style.background = "#fef9e7";
            modeBadge.style.color = "#f39c12";
          }

          currentHour = parsedTime.hour;
          currentMinute = parsedTime.minute;
          currentSecond = 0;

          drawClock(currentHour, currentMinute, 0);
          resultText.innerText = `✨ Đồng hồ đã chỉnh: ${currentHour} giờ ${currentMinute} phút`;
          
          // Đọc lại để xác nhận cho bé nghe
          speakTime(currentHour, currentMinute);
        } else {
          resultText.innerText = "⚠️ Chưa nghe rõ giờ. Bé thử nói lại nhé!";
        }
      };
    } else {
      statusText.innerText = "Trình duyệt không hỗ trợ nhận dạng giọng nói. Hãy dùng Google Chrome!";
    }
  </script>

</body>
</html>
